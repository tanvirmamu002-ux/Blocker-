name: Build Android APK (Windows)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest  # লিনাক্সের বদলে উইন্ডোজ সার্ভার ব্যবহার করা হচ্ছে

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: .\gradlew assembleDebug -x processDebugGoogleServices --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: focus-shield-apk
          path: app\build\outputs\apk\debug\*.apk